# exit site exit device (any Linux box: Raspberry Pi, mini PC, VM). /etc/wireguard/wg0.conf
# Dials out to the relay over the cellular ISP, so the cellular ISP's CGNAT and lack of a static IP don't matter.
# Traffic arriving from the tunnel leaves through the cellular ISP, so services see a exit site address.

[Interface]
Address = 10.99.0.3/24
PrivateKey = CHANGE-exitsite-private-key
MTU = 1420
Table = off
PostUp   = nft -f /etc/wireguard/us-exit.nft
PostDown = nft delete table ip us_exit

[Peer]
PublicKey = CHANGE-relay-public-key
Endpoint = 198.51.100.2:51820
AllowedIPs = 10.99.0.0/24
PersistentKeepalive = 25
