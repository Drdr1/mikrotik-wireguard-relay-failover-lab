# cloud relay (cloud VPS, Debian/Ubuntu). /etc/wireguard/wg0.conf, started with: systemctl enable --now wg-quick@wg0
# The relay only forwards between peers. It never sends US traffic out its own address:
# anything arriving from the tunnel that isn't for 10.99.0.0/24 goes back into the tunnel
# to the exit site peer (the only peer allowed 0.0.0.0/0).

[Interface]
Address = 10.99.0.1/24
ListenPort = 51820
PrivateKey = CHANGE-relay-private-key
MTU = 1420
Table = off
PostUp   = ip rule add iif wg0 lookup 100 pref 100
PostUp   = ip route add 10.99.0.0/24 dev wg0 table 100
PostUp   = ip route add default dev wg0 table 100
PostDown = ip rule del iif wg0 lookup 100 pref 100
PostDown = ip route flush table 100

[Peer]
# home MikroTik (dials out from whichever ISP is active)
PublicKey = CHANGE-mikrotik-public-key
AllowedIPs = 10.99.0.2/32

[Peer]
# exit site exit device (dials out from the cellular ISP)
PublicKey = CHANGE-exitsite-public-key
AllowedIPs = 10.99.0.3/32, 0.0.0.0/0

[Peer]
# Admin laptop, temporary: remove at handover
PublicKey = CHANGE-admin-public-key
AllowedIPs = 10.99.0.10/32
